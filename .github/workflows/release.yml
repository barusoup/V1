name: Release

# Runs when a full release is tagged, for example `v0.2.0`. Nightly commits never reach this.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the Cargo version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the app
        run: cargo build --release -p v1-app

      - name: Fetch FFmpeg (LGPL build, pinned and checksummed)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-03-12-50/ffmpeg-n9.0.2-45-g1e65c6cd5d-win64-lgpl-9.0.zip"
          $sha256 = "b1bae38cca5d84eb0f004f80cfb712d7bb755ef060e5a34207391228793c4406"
          New-Item -ItemType Directory -Force build\ffmpeg-download | Out-Null
          $zip = "build\ffmpeg-download\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) { throw "FFmpeg checksum mismatch: $actual" }
          Expand-Archive $zip -DestinationPath build\ffmpeg-download\extract -Force
          $root = Get-ChildItem build\ffmpeg-download\extract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force build\ffmpeg | Out-Null
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe", "$($root.FullName)\bin\ffprobe.exe", "$($root.FullName)\LICENSE.txt" -Destination build\ffmpeg

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$env:VERSION" (Resolve-Path installer\V1.nsi).Path
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/V1-Setup-${{ env.VERSION }}.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the Cargo version
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build Apple Silicon DMG
        run: ./installer/build-macos.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: target/aarch64-apple-darwin/release/V1-${{ env.VERSION }}-arm64.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist
          sha256sum V1-Setup-*.exe V1-*-arm64.dmg > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/V1-Setup-*.exe \
            dist/V1-*-arm64.dmg \
            dist/SHA256SUMS \
            --title "V1 $version" --generate-notes
