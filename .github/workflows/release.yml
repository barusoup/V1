name: Release

# Runs when a full release is tagged, for example `v0.2.0`. Nightly commits never reach this.
# A failed run can be republished against its existing tag with workflow_dispatch: the workflow
# file comes from the default branch, the checkout uses the tag, and the tag is never moved.
#
# A dispatch with `dry_run` set builds and uploads the same packages from the chosen branch but
# skips publishing, so a release can be checked on real runners before its tag is pushed.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (or the version being dry-run), for example v0.2.3"
        required: true
        type: string
      dry_run:
        description: "Build and verify every package without publishing the release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # A dry run checks out the branch it was dispatched from; a real run checks out the release tag.
  CHECKOUT_REF: ${{ inputs.dry_run && github.ref_name || inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Check the tag matches the Cargo version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$manifest" ]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the app
        run: cargo build --release -p v1-app

      - name: Fetch FFmpeg (LGPL build, pinned and checksummed)
        shell: pwsh
        run: |
          $url = "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-17-12-40/ffmpeg-n9.0.2-57-gd838f9f9ae-win64-lgpl-9.0.zip"
          $sha256 = "219edf130456945dec2e7e8b176026a94bc1008b81c4c1cd6d64c5e55f9213fa"
          New-Item -ItemType Directory -Force build\ffmpeg-download | Out-Null
          $zip = "build\ffmpeg-download\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) { throw "FFmpeg checksum mismatch: $actual" }
          Expand-Archive $zip -DestinationPath build\ffmpeg-download\extract -Force
          $root = Get-ChildItem build\ffmpeg-download\extract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force build\ffmpeg | Out-Null
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe", "$($root.FullName)\bin\ffprobe.exe", "$($root.FullName)\LICENSE.txt" -Destination build\ffmpeg

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$env:VERSION" (Resolve-Path installer\V1.nsi).Path
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/V1-Setup-${{ env.VERSION }}.exe

  release:
    needs: [windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist
          sha256sum V1-Setup-*.exe > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            dist/V1-Setup-*.exe \
            dist/SHA256SUMS \
            --title "V1 $version" --generate-notes
