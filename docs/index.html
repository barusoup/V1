<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V1</title>
<meta name="description" content="V1, a native YouTube Music client for Windows.">
<meta property="og:title" content="V1">
<meta property="og:description" content="A native YouTube Music client for Windows.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/social-card.png">
<link rel="icon" href="assets/app-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --bg: #000; --fg: #ececec; --btn: #ececec; --btn-fg: #000; --muted: #8a8a8a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 16px; text-align: center;
  }
  img.icon { width: 96px; height: 96px; }
  .tagline { margin: -12px 0 0; color: var(--muted); font-size: 15px; }
  .download {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 22px; border-radius: 8px;
    background: var(--btn); color: var(--btn-fg);
    text-decoration: none; font-weight: 600; font-size: 15px;
  }
  .download svg { width: 18px; height: 18px; fill: currentColor; }
  .download:hover { opacity: .85; }
  .buttons { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .github {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 8px;
    border: 1px solid #2a2a2a; color: var(--fg);
    text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .github svg { width: 18px; height: 18px; fill: currentColor; }
  .github:hover { background: #141414; }
</style>
</head>
<body>
  <img class="icon" src="assets/app-256.png" alt="V1">
  <p class="tagline">Native YouTube Music client written in Rust and Dream</p>

  <div class="buttons">
  <a class="download" id="download" href="https://github.com/barusoup/V1/releases/latest">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M0 3.45 9.75 2.1v9.4H0zM10.95 1.95 24 0v11.5H10.95zM0 12.6h9.75v9.4L0 20.65zM10.95 12.6H24V24l-13.05-1.85z"/></svg>
    <span>Download for Windows</span>
  </a>

  <a class="github" href="https://github.com/barusoup/V1">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.7 1.6.3 2.9.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
    <span>View on GitHub</span>
  </a>
  </div>

  <script>
    // Point the download button at the newest installer. Falls back to the releases page.
    (function () {
      var btn = document.getElementById("download");
      fetch("https://api.github.com/repos/barusoup/V1/releases/latest", {
        headers: { "Accept": "application/vnd.github+json" }
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (release) {
          if (!release || !release.assets) return;
          var exe = release.assets.find(function (a) {
            return /^V1-Setup-.*\.exe$/.test(a.name);
          });
          if (exe) btn.href = exe.browser_download_url;
        })
        .catch(function () { /* keep the releases fallback */ });
    })();
  </script>
</body>
</html>
